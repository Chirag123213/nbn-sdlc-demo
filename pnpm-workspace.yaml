packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'

  # Keep transitive Next/PostCSS dependencies on patched compatible versions.
  postcss: '^8.5.18'

  # Keep indirect runtime and build dependencies on versions with security fixes.
  sharp: '^0.35.5'
  'source-map-js': '^1.2.2'
  'proxy-addr': '^2.0.8'

  # Pin these transitive packages to releases that include their security fixes.
  js-yaml: 4.3.2
  nanoid: '^3.3.18'
  uuid: '>=11.1.1'

  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=2.0.0 <2.1.7': '2.1.7'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'

  '@grpc/grpc-js@<1.13.6': '1.13.6'
  '@grpc/grpc-js@>=1.14.0 <1.14.5': '1.14.5'

  'qs@<6.16.0': '6.16.0'
  'ip-address@<=10.7.0': '10.7.1'

  '@fastify/busboy': '3.2.2'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@fastify/busboy@3.2.2'

# The only published braces 3.x release is 3.0.3, but GHSA-vfj7-8cjw-p6xm
# lists 3.0.4 as the first patched release. This dev-only transitive advisory
# cannot be upgraded until an upstream patched version is published.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
